<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperWangYing — 产品工坊</title>
    <meta name="description" content="独立开发者的产品实验室，专注构建实用工具与创意应用">
    <meta property="og:title" content="SuperWangYing — 产品工坊">
    <meta property="og:description" content="独立开发者的产品实验室">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <style>
        :root {
            --bg: #0a0a0f; --bg2: #12121a; --bg3: #1a1a28; --bg4: #222236;
            --text: #f0f0f5; --text2: #a0a0b8; --text3: #6a6a82;
            --accent: #6366f1; --accent2: #818cf8; --accent-glow: rgba(99,102,241,0.15);
            --green: #22c55e; --amber: #f59e0b; --blue: #3b82f6; --pink: #ec4899;
            --border: #2a2a3e; --radius: 16px; --radius-sm: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; overflow-x: hidden; }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

        /* Hero */
        .hero { padding: 80px 0 60px; text-align: center; position: relative; }
        .hero::before { content: ''; position: absolute; top: -100px; left: 50%; transform: translateX(-50%); width: 600px; height: 400px; background: radial-gradient(ellipse, var(--accent-glow) 0%, transparent 70%); pointer-events: none; }
        .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; border-radius: 100px; background: var(--bg3); border: 1px solid var(--border); font-size: 13px; color: var(--text2); margin-bottom: 24px; }
        .hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .hero h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 12px; line-height: 1.2; }
        .hero h1 span { background: linear-gradient(135deg, var(--accent), var(--accent2), var(--pink)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .hero p { color: var(--text2); font-size: 17px; max-width: 500px; margin: 0 auto; }

        /* Stats */
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 0 0 48px; }
        .stat-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 20px; text-align: center; transition: all 0.3s; }
        .stat-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .stat-icon { font-size: 24px; margin-bottom: 8px; }
        .stat-num { font-size: 28px; font-weight: 800; color: var(--text); }
        .stat-label { font-size: 13px; color: var(--text3); margin-top: 2px; }

        /* Section */
        .section { padding: 0 0 48px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .section-title { font-size: 20px; font-weight: 700; }
        .section-count { font-size: 13px; color: var(--text3); background: var(--bg3); padding: 4px 12px; border-radius: 100px; }

        /* Filter */
        .filter-bar { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }
        .filter-btn { padding: 7px 16px; border-radius: 100px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: 13px; cursor: pointer; transition: all 0.2s; font-weight: 500; }
        .filter-btn:hover, .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* Product Grid */
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
        .product-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; transition: all 0.3s; cursor: pointer; position: relative; overflow: hidden; }
        .product-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent2)); opacity: 0; transition: opacity 0.3s; }
        .product-card:hover { border-color: var(--accent); transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
        .product-card:hover::before { opacity: 1; }
        .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 12px; }
        .card-icon { font-size: 36px; }
        .card-version { font-size: 12px; color: var(--text3); background: var(--bg3); padding: 3px 10px; border-radius: 100px; font-weight: 600; }
        .card-name { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
        .card-subtitle { font-size: 13px; color: var(--text2); margin-bottom: 12px; }
        .card-desc { font-size: 14px; color: var(--text3); line-height: 1.6; margin-bottom: 16px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .card-tag { font-size: 11px; padding: 3px 10px; border-radius: 6px; background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
        .card-actions { display: flex; gap: 8px; }
        .card-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; text-decoration: none; transition: all 0.2s; border: none; cursor: pointer; }
        .card-btn-primary { background: var(--accent); color: #fff; }
        .card-btn-primary:hover { background: var(--accent2); }
        .card-btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
        .card-btn-ghost:hover { border-color: var(--text3); color: var(--text); }

        /* Footer */
        .footer { padding: 32px 0; border-top: 1px solid var(--border); text-align: center; color: var(--text3); font-size: 13px; }
        .footer a { color: var(--accent2); text-decoration: none; }

        /* Empty */
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
        .empty-state .icon { font-size: 48px; margin-bottom: 16px; }

        @media (max-width: 768px) {
            .stats { grid-template-columns: repeat(2, 1fr); }
            .product-grid { grid-template-columns: 1fr; }
            .hero { padding: 48px 0 36px; }
        }
        @media (max-width: 480px) {
            .stats { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .stat-card { padding: 14px; }
            .stat-num { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="hero">
            <div class="hero-badge"><span class="dot"></span> 独立开发中</div>
            <h1>产品<span>工坊</span></h1>
            <p>专注构建实用工具与创意应用，每个产品都经过精心打磨</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-icon">📦</div>
                <div class="stat-num" id="statProducts">0</div>
                <div class="stat-label">产品总数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🌐</div>
                <div class="stat-num" id="statWebApps">0</div>
                <div class="stat-label">Web 应用</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🧩</div>
                <div class="stat-num" id="statPlugins">0</div>
                <div class="stat-label">浏览器插件</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🛠️</div>
                <div class="stat-num" id="statTools">0</div>
                <div class="stat-label">开发工具</div>
            </div>
        </div>

        <section class="section">
            <div class="section-header">
                <h2 class="section-title">全部产品</h2>
                <span class="section-count" id="productCount">0 个产品</span>
            </div>
            <div class="filter-bar" id="filterBar"></div>
            <div class="product-grid" id="productGrid"></div>
        </section>

        <footer class="footer">
            <p>© 2026 SuperWangYing · Built with ❤️ · <a href="https://github.com/superwangying" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script>
    const CATEGORY_COLORS = {
        'Web 应用': 'var(--blue)',
        '浏览器插件': 'var(--green)',
        '自研工具': 'var(--amber)',
    };

    let allProducts = [];
    let currentFilter = 'all';

    async function loadProducts() {
        try {
            const res = await fetch('data/products.json');
            const data = await res.json();
            allProducts = data;
            updateStats();
            renderFilters();
            renderProducts(allProducts);
        } catch (e) {
            document.getElementById('productGrid').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><p>产品数据加载失败</p></div>';
        }
    }

    function updateStats() {
        const total = allProducts.length;
        const webApps = allProducts.filter(p => p.category === 'Web 应用').length;
        const plugins = allProducts.filter(p => p.category === '浏览器插件').length;
        const tools = allProducts.filter(p => p.category === '自研工具').length;

        animateNumber('statProducts', total);
        animateNumber('statWebApps', webApps);
        animateNumber('statPlugins', plugins);
        animateNumber('statTools', tools);
    }

    function animateNumber(id, target) {
        const el = document.getElementById(id);
        let current = 0;
        const step = Math.max(1, Math.ceil(target / 20));
        const timer = setInterval(() => {
            current += step;
            if (current >= target) { current = target; clearInterval(timer); }
            el.textContent = current;
        }, 40);
    }

    function renderFilters() {
        const categories = [...new Set(allProducts.map(p => p.category))];
        const bar = document.getElementById('filterBar');
        let html = `<button class="filter-btn active" data-cat="all" onclick="filterProducts('all')">📋 全部 (${allProducts.length})</button>`;
        categories.forEach(cat => {
            const count = allProducts.filter(p => p.category === cat).length;
            html += `<button class="filter-btn" data-cat="${cat}" onclick="filterProducts('${cat}')">${cat} (${count})</button>`;
        });
        bar.innerHTML = html;
    }

    function renderProducts(products) {
        const grid = document.getElementById('productGrid');
        document.getElementById('productCount').textContent = `${products.length} 个产品`;

        if (products.length === 0) {
            grid.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无产品</p></div>';
            return;
        }

        grid.innerHTML = products.map(p => {
            const tags = (p.features || []).slice(0, 4).map(f => `<span class="card-tag">${f}</span>`).join('');
            const links = p.links || {};
            let actions = '';
            if (links.demo) actions += `<a href="${links.demo}" class="card-btn card-btn-primary" target="_blank">▶ 在线体验</a>`;
            if (links.github) actions += `<a href="${links.github}" class="card-btn card-btn-ghost" target="_blank">⭐ GitHub</a>`;
            if (links.download) actions += `<a href="${links.download}" class="card-btn card-btn-ghost" target="_blank">📥 下载</a>`;

            return `<div class="product-card" data-category="${p.category}">
                <div class="card-header">
                    <span class="card-icon">${p.icon}</span>
                    <span class="card-version">${p.version || ''}</span>
                </div>
                <div class="card-name">${p.name}</div>
                <div class="card-subtitle">${p.subtitle || ''}</div>
                <div class="card-desc">${p.description || ''}</div>
                <div class="card-tags">${tags}</div>
                <div class="card-actions">${actions}</div>
            </div>`;
        }).join('');
    }

    function filterProducts(cat) {
        currentFilter = cat;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
        const filtered = cat === 'all' ? allProducts : allProducts.filter(p => p.category === cat);
        renderProducts(filtered);
    }

    loadProducts();
    </script>
</body>
</html>
