<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=5.0">
<title>条漫阅读器</title>
<style>
/* ===== CSS Variables & Theme ===== */
:root {
  --bg-primary: #0a0a0c;
  --bg-secondary: #141418;
  --bg-tertiary: #1e1e24;
  --bg-card: #1a1a20;
  --text-primary: #e8e6e3;
  --text-secondary: #8a8a96;
  --text-muted: #55555f;
  --accent: #e85d3a;
  --accent-glow: rgba(232, 93, 58, 0.25);
  --border: rgba(255,255,255,0.06);
  --shadow: rgba(0,0,0,0.5);
  --overlay: rgba(0,0,0,0.7);
  --toolbar-bg: rgba(14,14,18,0.92);
  --toast-bg: rgba(30,30,38,0.95);
  --gap-size: 4px;
  --font-display: 'Outfit', sans-serif;
  --font-body: 'Noto Sans SC', 'Outfit', sans-serif;
  --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
}

[data-theme="light"] {
  --bg-primary: #f5f3f0;
  --bg-secondary: #eae7e2;
  --bg-tertiary: #ddd9d3;
  --bg-card: #ffffff;
  --text-primary: #1a1a1e;
  --text-secondary: #6b6b76;
  --text-muted: #9e9ea8;
  --accent: #d14e2d;
  --accent-glow: rgba(209, 78, 45, 0.15);
  --border: rgba(0,0,0,0.08);
  --shadow: rgba(0,0,0,0.1);
  --overlay: rgba(255,255,255,0.7);
  --toolbar-bg: rgba(245,243,240,0.92);
  --toast-bg: rgba(255,255,255,0.95);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html {
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-body);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 0.5s var(--transition-smooth), color 0.3s var(--transition-smooth);
  -webkit-font-smoothing: antialiased;
}

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--text-muted);
  border-radius: 3px;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

/* ===== Welcome Screen ===== */
.welcome-screen {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: var(--bg-primary);
  transition: opacity 0.6s var(--transition-smooth), transform 0.6s var(--transition-smooth);
}

.welcome-screen.hidden {
  opacity: 0;
  transform: scale(1.05);
  pointer-events: none;
}

.welcome-bg {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.welcome-bg::before {
  content: '';
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  top: 20%;
  left: 50%;
  transform: translateX(-50%);
  animation: breathe 6s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.5; }
  50% { transform: translateX(-50%) scale(1.2); opacity: 0.8; }
}

.welcome-content {
  position: relative;
  z-index: 1;
  text-align: center;
  padding: 2rem;
}

.welcome-logo {
  font-family: var(--font-display);
  font-size: clamp(2.5rem, 8vw, 4.5rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 0.5rem;
  line-height: 1.1;
}

.welcome-subtitle {
  font-size: 1rem;
  color: var(--text-secondary);
  margin-bottom: 3rem;
  font-weight: 300;
  letter-spacing: 0.05em;
}

/* ===== Drop Zone ===== */
.drop-zone {
  position: relative;
  width: min(420px, 85vw);
  height: 260px;
  border: 2px dashed var(--border);
  border-radius: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.4s var(--transition-smooth);
  background: var(--bg-secondary);
  overflow: hidden;
}

.drop-zone::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 20px;
  background: linear-gradient(135deg, transparent 40%, var(--accent-glow) 100%);
  opacity: 0;
  transition: opacity 0.4s var(--transition-smooth);
}

.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 12px 40px var(--shadow);
}

.drop-zone:hover::before, .drop-zone.drag-over::before {
  opacity: 1;
}

.drop-zone-icon {
  width: 56px;
  height: 56px;
  margin-bottom: 1rem;
  opacity: 0.4;
  transition: all 0.4s var(--transition-smooth);
}

.drop-zone:hover .drop-zone-icon, .drop-zone.drag-over .drop-zone-icon {
  opacity: 1;
  transform: translateY(-4px);
}

.drop-zone-text {
  font-size: 0.95rem;
  color: var(--text-secondary);
  position: relative;
  z-index: 1;
  transition: color 0.3s;
}

.drop-zone:hover .drop-zone-text, .drop-zone.drag-over .drop-zone-text {
  color: var(--text-primary);
}

.drop-zone-hint {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-top: 0.5rem;
  position: relative;
  z-index: 1;
}

.welcome-actions {
  display: flex;
  gap: 1rem;
  margin-top: 1.5rem;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.7rem 1.6rem;
  border: none;
  border-radius: 12px;
  font-family: var(--font-body);
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s var(--transition-smooth);
  position: relative;
  overflow: hidden;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 24px var(--accent-glow);
}

.btn-secondary {
  background: var(--bg-tertiary);
  color: var(--text-primary);
  border: 1px solid var(--border);
}

.btn-secondary:hover {
  background: var(--bg-card);
  transform: translateY(-1px);
}

.btn svg { width: 18px; height: 18px; }

/* ===== Reader Container ===== */
.reader-container {
  display: none;
  flex-direction: column;
  min-height: 100vh;
  position: relative;
}

.reader-container.active {
  display: flex;
}

/* ===== Top Bar ===== */
.top-bar {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 50;
  padding: 0.6rem 1rem;
  background: var(--toolbar-bg);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  transform: translateY(-100%);
  transition: transform 0.4s var(--transition-smooth);
}

.top-bar.visible {
  transform: translateY(0);
}

.top-bar-left, .top-bar-right {
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.top-bar-title {
  font-family: var(--font-display);
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 200px;
}

.top-bar-info {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-left: 0.5rem;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 10px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s var(--transition-smooth);
  flex-shrink: 0;
}

.icon-btn:hover {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}

.icon-btn svg { width: 20px; height: 20px; }

/* ===== Image Strip ===== */
.image-strip {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0;
  padding-top: 0;
  gap: var(--gap-size);
  min-height: 100vh;
  transition: gap 0.3s var(--transition-smooth);
  transform-origin: top center;
}

.image-strip.zoomed {
  cursor: grab;
}

.image-strip.zoomed:active {
  cursor: grabbing;
}

.strip-image-wrapper {
  width: 100%;
  max-width: 800px;
  position: relative;
  overflow: hidden;
  line-height: 0;
}

.strip-image-wrapper img {
  width: 100%;
  height: auto;
  display: block;
  user-select: none;
  -webkit-user-drag: none;
  opacity: 0;
  transition: opacity 0.5s var(--transition-smooth);
}

.strip-image-wrapper img.loaded {
  opacity: 1;
}

.strip-image-wrapper img.loading-error {
  opacity: 0.3;
  min-height: 200px;
  object-fit: contain;
}

/* Loading skeleton */
.image-skeleton {
  width: 100%;
  aspect-ratio: 3/4;
  background: linear-gradient(110deg, var(--bg-secondary) 8%, var(--bg-tertiary) 18%, var(--bg-secondary) 33%);
  background-size: 200% 100%;
  animation: shimmer 1.5s linear infinite;
  border-radius: 2px;
}

@keyframes shimmer {
  to { background-position: -200% 0; }
}

/* ===== Bottom Bar ===== */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 50;
  padding: 0.8rem 1rem;
  padding-bottom: max(0.8rem, env(safe-area-inset-bottom));
  background: var(--toolbar-bg);
  backdrop-filter: blur(20px) saturate(1.5);
  -webkit-backdrop-filter: blur(20px) saturate(1.5);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.2rem;
  transform: translateY(100%);
  transition: transform 0.4s var(--transition-smooth);
}

.bottom-bar.visible {
  transform: translateY(0);
}

.progress-bar-container {
  width: 100%;
  height: 3px;
  background: var(--bg-tertiary);
  border-radius: 2px;
  margin-bottom: 0.6rem;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  width: 0%;
  transition: width 0.15s ease-out;
}

/* ===== Settings Panel ===== */
.settings-panel {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 60;
  background: var(--bg-card);
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
  padding: 1.5rem;
  padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.4s var(--transition-smooth);
  box-shadow: 0 -10px 40px var(--shadow);
}

.settings-panel.visible {
  transform: translateY(0);
}

.settings-overlay {
  position: fixed;
  inset: 0;
  z-index: 55;
  background: var(--overlay);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s var(--transition-smooth);
}

.settings-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.settings-handle {
  width: 36px;
  height: 4px;
  background: var(--text-muted);
  border-radius: 2px;
  margin: 0 auto 1.2rem;
}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.8rem 0;
  border-bottom: 1px solid var(--border);
}

.settings-row:last-child { border-bottom: none; }

.settings-label {
  font-size: 0.88rem;
  color: var(--text-primary);
  font-weight: 500;
}

.settings-label-sub {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 0.15rem;
}

/* Range slider */
.range-slider {
  -webkit-appearance: none;
  appearance: none;
  width: 160px;
  height: 4px;
  background: var(--bg-tertiary);
  border-radius: 2px;
  outline: none;
}

.range-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  box-shadow: 0 2px 8px var(--accent-glow);
  transition: transform 0.2s;
}

.range-slider::-webkit-slider-thumb:hover {
  transform: scale(1.15);
}

.range-slider::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  border: none;
  box-shadow: 0 2px 8px var(--accent-glow);
}

/* Toggle switch */
.toggle {
  position: relative;
  width: 48px;
  height: 28px;
  background: var(--bg-tertiary);
  border-radius: 14px;
  cursor: pointer;
  transition: background 0.3s var(--transition-smooth);
  border: none;
  padding: 0;
}

.toggle.active {
  background: var(--accent);
}

.toggle::after {
  content: '';
  position: absolute;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #fff;
  top: 3px;
  left: 3px;
  transition: transform 0.3s var(--transition-smooth);
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

.toggle.active::after {
  transform: translateX(20px);
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--toast-bg);
  color: var(--text-primary);
  padding: 0.7rem 1.4rem;
  border-radius: 12px;
  font-size: 0.85rem;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: all 0.35s var(--transition-smooth);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  box-shadow: 0 8px 32px var(--shadow);
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== Page counter ===== */
.page-indicator {
  position: fixed;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 40;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.3s;
}

.page-indicator.visible {
  opacity: 1;
}

.page-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--text-muted);
  transition: all 0.3s;
}

.page-dot.active {
  background: var(--accent);
  height: 16px;
  border-radius: 2px;
}

/* ===== Zoom Controls ===== */
.zoom-controls {
  position: fixed;
  right: 16px;
  bottom: 80px;
  z-index: 45;
  display: flex;
  flex-direction: column;
  gap: 4px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s;
}

.zoom-controls.visible {
  opacity: 1;
  pointer-events: auto;
}

.zoom-btn {
  width: 40px;
  height: 40px;
  border: none;
  border-radius: 12px;
  background: var(--toolbar-bg);
  backdrop-filter: blur(12px);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  font-weight: 600;
  transition: all 0.25s var(--transition-smooth);
  border: 1px solid var(--border);
}

.zoom-btn:hover {
  background: var(--bg-tertiary);
  color: var(--text-primary);
}

.zoom-level {
  font-size: 0.65rem;
  color: var(--text-muted);
  text-align: center;
  padding: 2px 0;
  font-weight: 500;
}

/* ===== Animations ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.fade-in-up {
  animation: fadeInUp 0.6s var(--transition-smooth) forwards;
}

/* ===== Responsive ===== */
@media (max-width: 600px) {
  .welcome-logo { font-size: 2.2rem; }
  .drop-zone { width: 90vw; height: 220px; }
  .top-bar-title { max-width: 120px; font-size: 0.82rem; }
  .settings-row { flex-wrap: wrap; gap: 0.5rem; }
  .range-slider { width: 120px; }
  .zoom-controls { right: 8px; bottom: 70px; }
}

/* ===== Fullscreen reading mode ===== */
.reader-container.fullscreen .top-bar,
.reader-container.fullscreen .bottom-bar,
.reader-container.fullscreen .page-indicator,
.reader-container.fullscreen .zoom-controls {
  transition: transform 0.4s var(--transition-smooth), opacity 0.4s var(--transition-smooth);
}

.reader-container.fullscreen.bars-hidden .top-bar,
.reader-container.fullscreen.bars-hidden .bottom-bar {
  transform: translateY(-100%);
  opacity: 0;
  pointer-events: none;
}

.reader-container.fullscreen.bars-hidden .bottom-bar {
  transform: translateY(100%);
}

.reader-container.fullscreen.bars-hidden .page-indicator,
.reader-container.fullscreen.bars-hidden .zoom-controls {
  opacity: 0;
  pointer-events: none;
}

/* ===== Drag overlay ===== */
.drag-overlay {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(10,10,12,0.9);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s var(--transition-smooth);
}

.drag-overlay.visible {
  opacity: 1;
  pointer-events: auto;
}

.drag-overlay-content {
  text-align: center;
  color: var(--text-primary);
}

.drag-overlay-content svg {
  width: 64px;
  height: 64px;
  margin-bottom: 1rem;
  opacity: 0.6;
}

.drag-overlay-content p {
  font-size: 1.1rem;
  font-weight: 500;
}

/* ===== Empty state (no images) ===== */
.empty-reader {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 2rem;
  text-align: center;
}

.empty-reader svg {
  width: 80px;
  height: 80px;
  opacity: 0.2;
  margin-bottom: 1.5rem;
}

.empty-reader h2 {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-weight: 600;
  margin-bottom: 0.5rem;
  color: var(--text-secondary);
}

.empty-reader p {
  font-size: 0.85rem;
  color: var(--text-muted);
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

<!-- ===== Welcome Screen ===== -->
<div class="welcome-screen" id="welcomeScreen">
  <div class="welcome-bg"></div>
  <div class="welcome-content">
    <div class="welcome-logo">条漫阅读器</div>
    <div class="welcome-subtitle">沉浸式 Webtoon 阅读体验</div>

    <div class="drop-zone" id="dropZone">
      <svg class="drop-zone-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <div class="drop-zone-text">拖拽图片到这里</div>
      <div class="drop-zone-hint">或点击选择文件夹 / 图片文件</div>
    </div>

    <div class="welcome-actions">
      <button class="btn btn-primary" id="btnSelectFolder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
        </svg>
        选择文件夹
      </button>
      <button class="btn btn-secondary" id="btnSelectFiles">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        选择图片
      </button>
    </div>
  </div>
</div>

<!-- ===== Reader Container ===== -->
<div class="reader-container" id="readerContainer">
  <!-- Top Bar -->
  <div class="top-bar" id="topBar">
    <div class="top-bar-left">
      <button class="icon-btn" id="btnBack" title="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
      </button>
      <span class="top-bar-title" id="readerTitle">条漫阅读器</span>
      <span class="top-bar-info" id="readerInfo"></span>
    </div>
    <div class="top-bar-right">
      <button class="icon-btn" id="btnAddImages" title="添加更多图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/>
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button class="icon-btn" id="btnSettings" title="设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Image Strip -->
  <div class="image-strip" id="imageStrip"></div>

  <!-- Bottom Bar -->
  <div class="bottom-bar" id="bottomBar">
    <div class="progress-bar-container">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
    <button class="icon-btn" id="btnScrollTop" title="回到顶部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"/>
      </svg>
    </button>
    <span style="font-size:0.78rem;color:var(--text-muted);min-width:60px;text-align:center" id="progressText">0%</span>
    <button class="icon-btn" id="btnScrollBottom" title="跳到底部">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
  </div>

  <!-- Zoom Controls -->
  <div class="zoom-controls" id="zoomControls">
    <button class="zoom-btn" id="btnZoomIn" title="放大">+</button>
    <div class="zoom-level" id="zoomLevel">100%</div>
    <button class="zoom-btn" id="btnZoomOut" title="缩小">−</button>
    <button class="zoom-btn" id="btnZoomReset" title="重置" style="font-size:0.7rem">1:1</button>
  </div>
</div>

<!-- ===== Settings Panel ===== -->
<div class="settings-overlay" id="settingsOverlay"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-handle"></div>
  <div class="settings-row">
    <div>
      <div class="settings-label">深色模式</div>
      <div class="settings-label-sub">切换明暗主题</div>
    </div>
    <button class="toggle active" id="toggleTheme"></button>
  </div>
  <div class="settings-row">
    <div>
      <div class="settings-label">图片间距</div>
      <div class="settings-label-sub" id="gapValue">4px</div>
    </div>
    <input type="range" class="range-slider" id="sliderGap" min="0" max="24" value="4" step="1">
  </div>
  <div class="settings-row">
    <div>
      <div class="settings-label">阅读进度记忆</div>
      <div class="settings-label-sub">自动保存阅读位置</div>
    </div>
    <button class="toggle active" id="toggleProgress"></button>
  </div>
  <div class="settings-row">
    <div>
      <div class="settings-label">图片宽度</div>
      <div class="settings-label-sub" id="widthValue">自适应</div>
    </div>
    <input type="range" class="range-slider" id="sliderWidth" min="50" max="100" value="100" step="5">
  </div>
</div>

<!-- ===== Drag Overlay (for reader mode) ===== -->
<div class="drag-overlay" id="dragOverlay">
  <div class="drag-overlay-content">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="17 8 12 3 7 8"/>
      <line x1="12" y1="3" x2="12" y2="15"/>
    </svg>
    <p>释放以添加图片</p>
  </div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast"></div>

<!-- Hidden file inputs -->
<input type="file" id="folderInput" webkitdirectory directory multiple hidden>
<input type="file" id="filesInput" accept="image/*" multiple hidden>
<input type="file" id="addFilesInput" accept="image/*" multiple hidden>

<script>
(function() {
  'use strict';

  // ===== State =====
  const state = {
    images: [],          // { name, url, file }
    theme: 'dark',
    gap: 4,
    zoom: 1,
    progressMemory: true,
    imageWidth: 100,
    barsVisible: true,
    settingsOpen: false,
    sessionKey: null,
    scrollDebounce: null,
    pinchStartDistance: 0,
    pinchStartZoom: 1,
  };

  // ===== DOM Elements =====
  const $ = (sel) => document.querySelector(sel);
  const welcomeScreen = $('#welcomeScreen');
  const dropZone = $('#dropZone');
  const readerContainer = $('#readerContainer');
  const imageStrip = $('#imageStrip');
  const topBar = $('#topBar');
  const bottomBar = $('#bottomBar');
  const progressBar = $('#progressBar');
  const progressText = $('#progressText');
  const settingsPanel = $('#settingsPanel');
  const settingsOverlay = $('#settingsOverlay');
  const dragOverlay = $('#dragOverlay');
  const toastEl = $('#toast');
  const zoomControls = $('#zoomControls');
  const zoomLevelEl = $('#zoomLevel');

  // ===== Utilities =====
  function showToast(msg, duration = 2000) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastEl._timer);
    toastEl._timer = setTimeout(() => toastEl.classList.remove('show'), duration);
  }

  function isImageFile(file) {
    return file.type.startsWith('image/');
  }

  function sortImagesByName(files) {
    return [...files].filter(isImageFile).sort((a, b) => {
      const nameA = a.name.toLowerCase();
      const nameB = b.name.toLowerCase();
      // Natural sort
      return nameA.localeCompare(nameB, undefined, { numeric: true, sensitivity: 'base' });
    });
  }

  function generateSessionKey(files) {
    // Use first file name as session identifier
    if (files.length === 0) return null;
    const name = files[0].name;
    return 'webtoon_' + name.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_').substring(0, 50);
  }

  // ===== File Loading =====
  function loadFiles(files) {
    const sorted = sortImagesByName(files);
    if (sorted.length === 0) {
      showToast('未找到图片文件');
      return;
    }

    // Revoke old URLs
    state.images.forEach(img => {
      if (img.url) URL.revokeObjectURL(img.url);
    });

    state.images = sorted.map(file => ({
      name: file.name,
      url: URL.createObjectURL(file),
      file: file
    }));

    state.sessionKey = generateSessionKey(sorted);
    state.zoom = 1;
    updateZoomUI();

    enterReader();
    renderImages();
    showToast(`已加载 ${sorted.length} 张图片`);

    // Restore scroll position
    if (state.progressMemory && state.sessionKey) {
      const saved = localStorage.getItem(state.sessionKey + '_scroll');
      if (saved) {
        requestAnimationFrame(() => {
          window.scrollTo(0, parseInt(saved, 10));
        });
      }
    }
  }

  function addMoreFiles(files) {
    const sorted = sortImagesByName(files);
    if (sorted.length === 0) {
      showToast('未找到图片文件');
      return;
    }

    const newImages = sorted.map(file => ({
      name: file.name,
      url: URL.createObjectURL(file),
      file: file
    }));

    // Merge and re-sort
    state.images = [...state.images, ...newImages].sort((a, b) => {
      return a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' });
    });

    renderImages();
    showToast(`已添加 ${sorted.length} 张图片，共 ${state.images.length} 张`);
  }

  // ===== Rendering =====
  function renderImages() {
    imageStrip.innerHTML = '';
    $('#readerInfo').textContent = `${state.images.length} 页`;

    state.images.forEach((img, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'strip-image-wrapper';
      wrapper.style.maxWidth = state.imageWidth + '%';

      // Skeleton
      const skeleton = document.createElement('div');
      skeleton.className = 'image-skeleton';
      wrapper.appendChild(skeleton);

      // Image
      const imgEl = document.createElement('img');
      imgEl.alt = img.name;
      imgEl.dataset.index = index;
      imgEl.draggable = false;

      imgEl.onload = () => {
        imgEl.classList.add('loaded');
        skeleton.remove();
      };

      imgEl.onerror = () => {
        imgEl.classList.add('loading-error');
        imgEl.src = '';
        imgEl.alt = '加载失败: ' + img.name;
        skeleton.remove();
      };

      imgEl.src = img.url;
      wrapper.appendChild(imgEl);
      imageStrip.appendChild(wrapper);
    });

    applyZoom();
  }

  // ===== Navigation =====
  function enterReader() {
    welcomeScreen.classList.add('hidden');
    readerContainer.classList.add('active');
    readerContainer.classList.add('fullscreen');
    state.barsVisible = true;
    showBars();
  }

  function exitReader() {
    // Save progress before leaving
    saveProgress();

    readerContainer.classList.remove('active');
    readerContainer.classList.remove('fullscreen');
    welcomeScreen.classList.remove('hidden');

    // Clear images
    state.images.forEach(img => {
      if (img.url) URL.revokeObjectURL(img.url);
    });
    state.images = [];
    imageStrip.innerHTML = '';
  }

  function showBars() {
    topBar.classList.add('visible');
    bottomBar.classList.add('visible');
    zoomControls.classList.add('visible');
    state.barsVisible = true;
  }

  function hideBars() {
    topBar.classList.remove('visible');
    bottomBar.classList.remove('visible');
    zoomControls.classList.remove('visible');
    state.barsVisible = false;
  }

  function toggleBars() {
    if (state.barsVisible) {
      hideBars();
      readerContainer.classList.add('bars-hidden');
    } else {
      showBars();
      readerContainer.classList.remove('bars-hidden');
    }
  }

  // ===== Progress =====
  function updateProgress() {
    const scrollTop = window.scrollY;
    const docHeight = document.documentElement.scrollHeight - window.innerHeight;
    const progress = docHeight > 0 ? Math.min(100, Math.round((scrollTop / docHeight) * 100)) : 0;
    progressBar.style.width = progress + '%';
    progressText.textContent = progress + '%';
  }

  function saveProgress() {
    if (!state.progressMemory || !state.sessionKey) return;
    try {
      localStorage.setItem(state.sessionKey + '_scroll', window.scrollY.toString());
      localStorage.setItem(state.sessionKey + '_count', state.images.length.toString());
    } catch (e) { /* ignore */ }
  }

  // ===== Zoom =====
  function setZoom(level) {
    state.zoom = Math.max(0.5, Math.min(3, level));
    applyZoom();
    updateZoomUI();
  }

  function applyZoom() {
    imageStrip.style.transform = `scale(${state.zoom})`;
    imageStrip.style.transformOrigin = 'top center';

    if (state.zoom > 1) {
      imageStrip.classList.add('zoomed');
      document.body.style.overflowX = 'auto';
    } else {
      imageStrip.classList.remove('zoomed');
      document.body.style.overflowX = 'hidden';
    }
  }

  function updateZoomUI() {
    zoomLevelEl.textContent = Math.round(state.zoom * 100) + '%';
  }

  // ===== Theme =====
  function setTheme(theme) {
    state.theme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    const toggle = $('#toggleTheme');
    if (theme === 'dark') {
      toggle.classList.add('active');
    } else {
      toggle.classList.remove('active');
    }
    try {
      localStorage.setItem('webtoon_theme', theme);
    } catch (e) { /* ignore */ }
  }

  // ===== Settings =====
  function openSettings() {
    state.settingsOpen = true;
    settingsPanel.classList.add('visible');
    settingsOverlay.classList.add('visible');
  }

  function closeSettings() {
    state.settingsOpen = false;
    settingsPanel.classList.remove('visible');
    settingsOverlay.classList.remove('visible');
  }

  // ===== Event Bindings =====
  function init() {
    // Load saved theme
    try {
      const savedTheme = localStorage.getItem('webtoon_theme');
      if (savedTheme) setTheme(savedTheme);
    } catch (e) { /* ignore */ }

    // Drop zone click
    dropZone.addEventListener('click', () => {
      // Try folder first, fallback to files
      if (window.showDirectoryPicker) {
        pickDirectory();
      } else {
        $('#folderInput').click();
      }
    });

    // Select folder button
    $('#btnSelectFolder').addEventListener('click', (e) => {
      e.stopPropagation();
      if (window.showDirectoryPicker) {
        pickDirectory();
      } else {
        $('#folderInput').click();
      }
    });

    // Select files button
    $('#btnSelectFiles').addEventListener('click', (e) => {
      e.stopPropagation();
      $('#filesInput').click();
    });

    // Folder input change
    $('#folderInput').addEventListener('change', (e) => {
      if (e.target.files.length > 0) loadFiles(e.target.files);
      e.target.value = '';
    });

    // Files input change
    $('#filesInput').addEventListener('change', (e) => {
      if (e.target.files.length > 0) loadFiles(e.target.files);
      e.target.value = '';
    });

    // Add files input change
    $('#addFilesInput').addEventListener('change', (e) => {
      if (e.target.files.length > 0) addMoreFiles(e.target.files);
      e.target.value = '';
    });

    // Add images button
    $('#btnAddImages').addEventListener('click', () => {
      $('#addFilesInput').click();
    });

    // Back button
    $('#btnBack').addEventListener('click', exitReader);

    // Settings
    $('#btnSettings').addEventListener('click', openSettings);
    settingsOverlay.addEventListener('click', closeSettings);

    // Theme toggle
    $('#toggleTheme').addEventListener('click', () => {
      setTheme(state.theme === 'dark' ? 'light' : 'dark');
    });

    // Gap slider
    $('#sliderGap').addEventListener('input', (e) => {
      state.gap = parseInt(e.target.value);
      document.documentElement.style.setProperty('--gap-size', state.gap + 'px');
      $('#gapValue').textContent = state.gap + 'px';
    });

    // Width slider
    $('#sliderWidth').addEventListener('input', (e) => {
      state.imageWidth = parseInt(e.target.value);
      $('#widthValue').textContent = state.imageWidth === 100 ? '自适应' : state.imageWidth + '%';
      document.querySelectorAll('.strip-image-wrapper').forEach(w => {
        w.style.maxWidth = state.imageWidth + '%';
      });
    });

    // Progress memory toggle
    $('#toggleProgress').addEventListener('click', () => {
      state.progressMemory = !state.progressMemory;
      $('#toggleProgress').classList.toggle('active', state.progressMemory);
      if (!state.progressMemory && state.sessionKey) {
        try {
          localStorage.removeItem(state.sessionKey + '_scroll');
          localStorage.removeItem(state.sessionKey + '_count');
        } catch (e) { /* ignore */ }
      }
    });

    // Zoom controls
    $('#btnZoomIn').addEventListener('click', () => setZoom(state.zoom + 0.25));
    $('#btnZoomOut').addEventListener('click', () => setZoom(state.zoom - 0.25));
    $('#btnZoomReset').addEventListener('click', () => setZoom(1));

    // Scroll top / bottom
    $('#btnScrollTop').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    $('#btnScrollBottom').addEventListener('click', () => {
      window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
    });

    // Scroll progress
    window.addEventListener('scroll', () => {
      updateProgress();
      // Debounced progress save
      clearTimeout(state.scrollDebounce);
      state.scrollDebounce = setTimeout(saveProgress, 500);
    }, { passive: true });

    // Tap to toggle bars
    let lastTapTime = 0;
    readerContainer.addEventListener('click', (e) => {
      // Ignore clicks on buttons and controls
      if (e.target.closest('.top-bar, .bottom-bar, .zoom-controls, .settings-panel, .settings-overlay')) return;

      const now = Date.now();
      if (now - lastTapTime < 300) {
        // Double tap - reset zoom
        if (state.zoom !== 1) {
          setZoom(1);
        }
      } else {
        // Single tap - toggle bars (with delay to check for double tap)
        setTimeout(() => {
          if (Date.now() - lastTapTime >= 280) {
            toggleBars();
          }
        }, 300);
      }
      lastTapTime = now;
    });

    // ===== Drag & Drop =====
    let dragCounter = 0;

    // Welcome screen drag
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('drag-over');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('drag-over');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      if (e.dataTransfer.files.length > 0) {
        loadFiles(e.dataTransfer.files);
      }
    });

    // Global drag (reader mode)
    document.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      if (readerContainer.classList.contains('active')) {
        dragOverlay.classList.add('visible');
      }
    });

    document.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0) {
        dragCounter = 0;
        dragOverlay.classList.remove('visible');
      }
    });

    document.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    document.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      dragOverlay.classList.remove('visible');

      if (e.dataTransfer.files.length > 0) {
        if (readerContainer.classList.contains('active')) {
          addMoreFiles(e.dataTransfer.files);
        } else {
          loadFiles(e.dataTransfer.files);
        }
      }
    });

    // ===== Pinch Zoom (Touch) =====
    imageStrip.addEventListener('touchstart', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        state.pinchStartDistance = Math.hypot(dx, dy);
        state.pinchStartZoom = state.zoom;
      }
    }, { passive: false });

    imageStrip.addEventListener('touchmove', (e) => {
      if (e.touches.length === 2) {
        e.preventDefault();
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const distance = Math.hypot(dx, dy);
        const scale = distance / state.pinchStartDistance;
        setZoom(state.pinchStartZoom * scale);
      }
    }, { passive: false });

    // ===== Keyboard shortcuts =====
    document.addEventListener('keydown', (e) => {
      if (!readerContainer.classList.contains('active')) return;

      switch (e.key) {
        case 'Escape':
          if (state.settingsOpen) closeSettings();
          else if (state.zoom !== 1) setZoom(1);
          else exitReader();
          break;
        case '+':
        case '=':
          setZoom(state.zoom + 0.25);
          break;
        case '-':
          setZoom(state.zoom - 0.25);
          break;
        case '0':
          setZoom(1);
          break;
        case 'Home':
          window.scrollTo({ top: 0, behavior: 'smooth' });
          break;
        case 'End':
          window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'smooth' });
          break;
        case ' ':
          e.preventDefault();
          toggleBars();
          break;
      }
    });

    // ===== Mouse wheel zoom (Ctrl+scroll) =====
    readerContainer.addEventListener('wheel', (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
        const delta = e.deltaY > 0 ? -0.1 : 0.1;
        setZoom(state.zoom + delta);
      }
    }, { passive: false });
  }

  // ===== File System Access API =====
  async function pickDirectory() {
    try {
      const dirHandle = await window.showDirectoryPicker();
      const files = [];
      for await (const entry of dirHandle.values()) {
        if (entry.kind === 'file') {
          const file = await entry.getFile();
          if (isImageFile(file)) {
            files.push(file);
          }
        }
      }
      if (files.length > 0) {
        loadFiles(files);
      } else {
        showToast('文件夹中未找到图片');
      }
    } catch (e) {
      if (e.name !== 'AbortError') {
        showToast('无法访问文件夹，请尝试其他方式');
      }
    }
  }

  // ===== Init =====
  init();
})();
</script>
</body>
</html>
