    <line x1="15.5" y1="30" x2="38" y2="30" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity=".65"/>
    <line x1="15.5" y1="39.5" x2="41" y2="39.5" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity=".45"/>
    <path d="M15.5 50 L23 56.5 L15.5 63" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <line x1="25.5" y1="63" x2="38" y2="63" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
