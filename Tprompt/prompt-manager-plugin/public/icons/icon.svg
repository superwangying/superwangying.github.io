      <stop offset="0%" stop-color="#4a4f5a"/>
      <stop offset="100%" stop-color="#373b44"/>
    </linearGradient>
    <filter id="ps" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000" flood-opacity=".06"/>
    </filter>
  </defs>
  <!-- 浅灰圆角矩形垫底 -->
  <rect x="0" y="0" width="128" height="128" rx="23" fill="#eef0f4" filter="url(#ps)"/>
